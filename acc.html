<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wireframe Layout</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .section {
      text-align: center;
      padding: 20px;
      border-bottom: 1px solid black;
    }
    .bottom-section {
        background-color: aqua;
      display: flex;
      justify-content: space-around;
      padding: 20px;
    }
    .block {
      width: 30%;
      height: 100px;
      background-color:purple;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid black;
    }
  </style>
</head>
<body>

  <div class="section" style="background-color: red;">
    <strong>Logo</strong>
  </div>

  <div class="section" style="background-color:blue;">
    <strong>Header</strong>
  </div>

  <div class="section" style="background-color: green;">
    <strong>Text Area</strong>
  </div>

  <div class="bottom-section">
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>
    <div class="block">Block 3</div>
  </div>
  <div class="section" style="background-color: brown;">
    <strong>Footer</strong>
  </div>

</body>
</html>
